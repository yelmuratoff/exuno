# Template for AI Tool Configuration
# Copy this file inside `.ai/src/tools/` as "<tool>.yaml" to add a new tool.

# Name of the tool (displayed in logs)
name: "Tool Name"

# Enable or disable synchronization for this tool
enabled: false

# Set to false when a client reads only project-root files and cannot consume
# the config-home paths created by `exuno profile add`.
# profile_supported: false

# Optional: profile variant. A thin variant tool (e.g. claude-hub.yaml) declares
# `base:` to inherit every field it does not set from the base tool, so it only
# needs to override the config-home dests below. `profile_home` records the
# config-home directory the variant writes into. Both are managed by
# `exuno profile add` — you rarely write them by hand.
# base: claude
# profile_home: ".claude-hub"

# Define where files should be copied. Every target below also accepts
# `enabled: false` to opt this tool out of that whole category — even when a
# dest would still resolve (e.g. inherited from the base tool via `base:`).
# Omit it, or use any other value, to keep the default (enabled).
targets:
  # The "Identity" file (AGENTS.md)
  agents:
    # Destination path relative to repo root
    dest: ".tool/AGENTS.md"

    # Set false when the output includes generated content that cannot be
    # copied back into source AGENTS.md by `exuno adopt`.
    # adoptable: false

    # Optional: opt this tool out of this category entirely (works on any target).
    # Handy for `base:` variants that inherit a category they should not emit —
    # e.g. a profile that lets the base config own the rules.
    # enabled: false

    # Optional: Override source file (default is .ai/src/AGENTS.md)
    # source: ".ai/src/AGENTS.tiny.md"

  # The "Rules" directory
  rules:
    # Destination directory for rule files
    dest: ".tool/rules"

    # Optional: Change file extension (default: keep original .md)
    # extension: ".mdc"

    # Optional: Add a header to the top of every rule file
    # header: 'globs: "**/*"'

    # Optional: Scoped header for rules that declare `paths:` frontmatter (a list
    # of globs). The `{globs}` placeholder is replaced with the rule's comma-joined
    # globs, and `{globs_list}` with a YAML flow list of single-quoted globs, so
    # the rule loads only when matching files are touched instead of on every
    # task. Rules without `paths:` fall back to the always-on `header` above.
    # scoped_header: "---\nglobs: '{globs}'\nalwaysApply: false\n---"

    # Optional: Filter rules (globs). Each accepts a scalar ("a b c"),
    # an inline list ([a, b]), or a block list (one `- glob` per line).
    # include: "flutter-*.md"
    # exclude: "secret-*.md"

    # Optional: Override source directory (default is .ai/src/rules)
    # source: ".ai/src/my-rules"

    # Optional, any target: where an earlier release of this config wrote the
    # target. Sync removes the files there the manifest records (never
    # hand-written ones) once the target moves to `dest`.
    # legacy_dest: ".tool/old-rules"

    # Optional: Append imports to the main AGENTS file (Claude-specific)
    # append_imports: false

    # Optional: Merge all rules into a single file instead of a directory
    # merge_to_file: false

    # Optional: Append lightweight rule references (name + title) into agents file
    # instead of syncing rules as separate files (for tools without separate rules dir)
    # inline_into_agents: false

    # Optional: Prepend AGENTS.md content before merged rules (used with merge_to_file)
    # prepend_agents: false

  # The "Skills" directory
  skills:
    # Destination directory for skill folders
    dest: ".tool/skills"

    # Optional: Filter skills by name or by category path
    # include: "flutter*"
    # exclude: "python* cloudflare/*"

    # Optional: Override source directory
    # source: ".ai/src/my-skills"

    # Optional: Append lightweight skill index (name + description) into agents file
    # instead of syncing skills as directories (for tools without native skills support)
    # inline_into_agents: false

    # Optional: Directories, relative to $HOME, the tool reads personal skills
    # from. `exuno doctor` advises when a project skill shares a name with one.
    # user_dirs: ".tool/skills"

  # Custom slash commands (optional)
  # commands:
  #   dest: ".tool/commands"
  #   # extension: ".cmd.md"      # Optional: change file extension
  #   # format: toml              # Optional: convert each command to TOML (Gemini CLI)
  #   # include: "*.md"           # Optional: filter (space-separated globs)
  #   # exclude: "draft-*.md"     # Optional: filter (space-separated globs)
  #
  #   # For tools without a native commands surface (e.g. Codex):
  #   # emit each .ai/src/commands/<name>.md as a generated skill at
  #   # <targets.skills.dest>/command-<name>/SKILL.md. Requires targets.skills.dest.
  #   # Mutually exclusive with `dest` and `inline_into_agents`.
  #   # as_skills: true
  #
  #   # For tools that also lack a skills dir (e.g. Amazon Q, Zed):
  #   # append a "## Commands" index to the AGENTS-like file with
  #   # one "- `/<name>` — <description>" line per command.
  #   # Requires targets.agents.dest (or rules.merge_to_file fallback).
  #   # Mutually exclusive with `dest` and `as_skills`.
  #   # inline_into_agents: true

  # Subagent personas (optional)
  # subagents:
  #   dest: ".tool/agents"
  #   # extension: ".agent.md"    # Optional: change file extension
  #   # format: opencode_md       # Optional: convert portable frontmatter —
  #   #                           # opencode_md, toml, amazonq_json, or kiro_md

  # Settings/permissions (optional, file copy)
  # settings:
  #   source: ".ai/src/settings/tool.json"
  #   dest: ".tool/settings.json"
  #   # For a TOML or JSON dest: `keys` owns only the keys the source declares
  #   # and keeps every key the tool itself wrote; `file` owns the whole file;
  #   # `auto` (the default) picks `keys` when the project root is $HOME or the
  #   # tool is a profile variant, else `file`. A file composed from settings
  #   # and MCP (codex_toml, opencode_json) follows this option.
  #   # ownership: auto
  #   # For a JSON dest: each name in exuno.yaml's `skills.hide` is set to
  #   # hide_skills_value under the dotted hide_skills_key, so the tool skips
  #   # a personal skill of that name in this project.
  #   # hide_skills_key: "skillOverrides"
  #   # hide_skills_value: "off"

  # MCP server configs (optional, file copy)
  # mcp:
  #   source: ".ai/src/mcp/tool.json"
  #   dest: ".tool/.mcp.json"
  #   # ownership: auto           # As for settings; each server is owned whole
  #   # format: opencode_json     # Optional: compose into OpenCode settings
  #   # format: kimi_json         # Optional: mcp use writes Kimi-native HTTP JSON
  #   # format: codex_toml        # Optional: compose into Codex settings

  # Hooks (optional, file copy)
  # hooks:
  #   source: ".ai/src/hooks/tool.json"
  #   dest: ".tool/hooks.json"

  # Guard (optional, file copy + chmod +x) — a script the tool runs before it
  # edits a file, to refuse writes to generated output. Exuno ships a base
  # guard per tool; a project overrides it at .ai/src/tools/<tool>/guard.sh.
  # Register it from the tool's settings.
  # guard:
  #   dest: ".tool/hooks/agentsync-guard.sh"
  #   profile_scoped: false   # config-home profiles share one copy at this path

  # `profile_scoped: false` works on any target: `exuno profile add` keeps
  # the base dest instead of rewriting it into the profile's config home, for
  # project-level content every home shares.

# Optional: Command to run after sync (e.g. linter or formatter)
# post_sync: "npx prettier --write .tool/rules/*.mdc"
