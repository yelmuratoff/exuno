name: "OpenAI Codex"
enabled: false

targets:
  agents:
    dest: "AGENTS.md"

  rules:
    inline_into_agents: true

  skills:
    dest: ".agents/skills"
    user_dirs: ".agents/skills"

  commands:
    as_skills: true

  subagents:
    dest: ".codex/agents"
    format: toml

  hooks:
    source: ".ai/src/hooks/codex.json"
    dest: ".codex/hooks.json"

  settings:
    source: ".ai/src/settings/codex.toml"
    dest: ".codex/config.toml"
    ownership: auto

  mcp:
    dest: ".codex/config.toml"
    format: codex_toml

# Local memories, read by `exuno memory`: generated state under CODEX_HOME,
# memories_v2/ on a fresh install and memories/ kept from v1
# (https://developers.openai.com/codex/memories).
memory:
  home: "~/.codex"
  home_env: "CODEX_HOME"
  dirs: [memories_v2, memories]
