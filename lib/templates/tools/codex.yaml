name: "OpenAI Codex"
enabled: false

targets:
  agents:
    dest: "AGENTS.md"

  rules:
    inline_into_agents: true

  skills:
    dest: ".agents/skills"
    user_dirs: ".agents/skills"

  commands:
    as_skills: true

  subagents:
    dest: ".codex/agents"
    format: toml

  hooks:
    source: ".ai/src/hooks/codex.json"
    dest: ".codex/hooks.json"

  settings:
    source: ".ai/src/settings/codex.toml"
    dest: ".codex/config.toml"
    ownership: auto

  mcp:
    dest: ".codex/config.toml"
    format: codex_toml
