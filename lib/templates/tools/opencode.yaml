name: "OpenCode"
enabled: false

targets:
  agents:
    dest: "AGENTS.md"

  rules:
    inline_into_agents: true

  skills:
    dest: ".opencode/skills"

  commands:
    dest: ".opencode/commands"

  subagents:
    dest: ".opencode/agents"
    format: opencode_md

  settings:
    source: ".ai/src/settings/opencode.json"
    dest: "opencode.json"
    hide_skills_key: "permission.skill"
    hide_skills_value: "deny"

  mcp:
    dest: "opencode.json"
    format: opencode_json

  hooks:
    source: ".ai/src/hooks/opencode.ts"
    dest: ".opencode/plugins/agentsync.ts"
