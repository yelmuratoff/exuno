name: "Claude Code"
enabled: false

targets:
  agents:
    dest: "CLAUDE.md"

  rules:
    dest: ".claude/rules"

  skills:
    dest: ".claude/skills"
    user_dirs: ".claude/skills"

  commands:
    dest: ".claude/commands"

  subagents:
    dest: ".claude/agents"

  settings:
    source: ".ai/src/settings/claude.json"
    dest: ".claude/settings.json"
    hide_skills_key: "skillOverrides"
    hide_skills_value: "off"

  mcp:
    source: ".ai/src/mcp/claude.json"
    dest: ".mcp.json"

  # Blocks edits to generated files; wired up by hooks.PreToolUse in settings.
  # Not profile-scoped: settings reference it through ${CLAUDE_PROJECT_DIR}, so
  # every config home shares this one script instead of getting a dead copy.
  guard:
    dest: ".claude/hooks/agentsync-guard.sh"
    profile_scoped: false

# Auto memory, read by `exuno memory`. Each project's notes live under
# projects/<path with every non-alphanumeric character as "-">/memory, and
# Claude Code loads the first 200 lines or 25 KB of MEMORY.md
# (https://code.claude.com/docs/en/memory).
memory:
  home: "~/.claude"
  home_env: "CLAUDE_CONFIG_DIR"
  dirs: ["projects/{project}/memory"]
  project_key: "path-dashed"
  index: "MEMORY.md"
  index_max_lines: 200
  index_max_bytes: 25600
  types: [user, feedback, project, reference]
