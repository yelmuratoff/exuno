# Exuno - Global Configuration
# Source paths (relative to repo root)

source:
  agents: ".ai/src/AGENTS.md"
  rules: ".ai/src/rules"
  skills: ".ai/src/skills"
  tools: ".ai/src/tools"

# Post-sync hooks run arbitrary shell from a tool YAML, so they are gated behind
# an out-of-repo trust signal: export EXUNO_ALLOW_POST_SYNC=true, or set
# allow: true here and rebuild — this file is compiled into the binary. The
# in-repo exuno.yaml cannot enable them — cloning and syncing an untrusted
# repo must not run its hook.
post_sync:
  allow: false
