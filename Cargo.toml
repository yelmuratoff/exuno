[package]
name = "exuno"
# Equal to VERSION: `exuno release` bumps both, and src/lib.rs tests the pair.
version = "0.44.2"
edition = "2024"
rust-version = "1.85"
description = "Sync AI agent instructions from .ai/src/ to every tool."
license = "GPL-3.0-only"
repository = "https://github.com/yelmuratoff/exuno"
publish = false

# publish = false hides the crate from dist; this opts it back in.
[package.metadata.dist]
dist = true

[dependencies]
include_dir = "0.7"
serde = "1"
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
signal-hook = { version = "0.4", default-features = false }
thiserror = "2"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dist]
inherits = "release"
